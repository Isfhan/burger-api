name: Publish CLI to npm

on:
    push:
        tags:
            - 'cli/v*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to publish (e.g., cli/v1.0.0)'
                required: true
                type: string

env:
    BUN_VERSION: 1.3.4

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Setup Node.js (for npm)
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: |
                  cd packages/cli
                  bun install

            - name: Get version from tag
              id: get_version
              run: |
                  if [ "${{ github.event.inputs.version }}" != "" ]; then
                    VERSION="${{ github.event.inputs.version }}"
                    # Strip cli/ prefix if present
                    VERSION="${VERSION#cli/}"
                  else
                    VERSION="${GITHUB_REF#refs/tags/cli/}"
                  fi
                  # Strip 'v' prefix if present (e.g., v0.6.6 -> 0.6.6)
                  VERSION="${VERSION#v}"
                  echo "VERSION=${VERSION}" >> $GITHUB_ENV
                  echo "version=${VERSION}" >> $GITHUB_OUTPUT
              shell: bash

            - name: Verify package.json version matches tag
              run: |
                  cd packages/cli
                  PACKAGE_VERSION=$(bun -e "console.log(require('./package.json').version)")
                  if [ "$PACKAGE_VERSION" != "${{ env.VERSION }}" ]; then
                    echo "❌ Version mismatch: package.json has $PACKAGE_VERSION but tag is ${{ env.VERSION }}"
                    exit 1
                  fi
                  echo "✅ Version match: $PACKAGE_VERSION"
              shell: bash

            - name: Run CLI tests
              run: |
                  cd packages/cli
                  bun test --timeout 30000 ./test
              shell: bash

            - name: Check what will be published
              run: |
                  cd packages/cli
                  npm pack --dry-run
              shell: bash

            - name: Publish to npm
              run: |
                  cd packages/cli
                  npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Verify publication
              run: |
                  echo "✅ Published @burger-api/cli@${{ env.VERSION }} to npm"
                  echo "📦 Package: https://www.npmjs.com/package/@burger-api/cli"
                  echo "🔗 Install: bun add -g @burger-api/cli"
              shell: bash

