name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  BUN_VERSION: 1.4.4

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    name: test (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # node-server tests and the node build target run on plain Node.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build framework (dist for linked packages + examples)
        run: bun run build

      - name: Register global links (create-E2E scaffolds resolve local packages)
        run: |
          cd packages/burger-api && bun link
          cd ../cli && bun link

      - name: Full test suite + typecheck
        run: bun run test:all
