name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  BUN_VERSION: 1.3.4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Build framework (dist for linked packages + examples)
        run: bun run build

      - name: Register global links (create-E2E scaffolds resolve local packages)
        run: |
          cd packages/burger-api && bun link
          cd ../cli && bun link

      - name: Build example bundle for CLI build-output test
        run: |
          cd packages/burger-api/examples/production-app
          bun run ../../../cli/src/index.ts build src/index.ts --outfile .build/bundle/app.js

      - name: Full test suite + typecheck
        run: bun run test:all
