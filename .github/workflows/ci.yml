name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build example bundle for CLI build-output test
        run: |
          cd packages/burger-api/examples/file-base-api-routing
          bun run ../../../cli/src/index.ts build index.ts --outfile .build/bundle/app.js

      - name: Full test suite + typecheck
        run: bun run test:all
