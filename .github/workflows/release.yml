name: Release CLI Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  BUN_VERSION: 1.3.4

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            script: build:linux
            output: burger-api-linux
            asset_name: burger-api-linux
          
          - os: windows-latest
            target: windows
            script: build:win
            output: burger-api.exe
            asset_name: burger-api.exe
          
          - os: macos-latest
            target: mac-arm64
            script: build:mac
            output: burger-api-mac
            asset_name: burger-api-mac
          
          - os: macos-latest
            target: mac-intel
            script: build:mac-intel
            output: burger-api-mac-intel
            asset_name: burger-api-mac-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js (for bun compatibility)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd packages/cli
          bun install

      - name: Get version from tag (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
        shell: bash
      
      - name: Get version from tag (Windows)
        if: runner.os == 'Windows'
        run: |
          if ("${{ github.event.inputs.version }}") {
            $VERSION = "${{ github.event.inputs.version }}"
          } else {
            $VERSION = "${{ github.ref }}".Replace('refs/tags/', '')
          }
          echo "VERSION=$VERSION" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Build executable
        run: |
          cd packages/cli
          mkdir -p dist
          bun run ${{ matrix.script }}

      - name: Display build output (debug)
        run: |
          ls -la packages/cli/dist/
        shell: bash
        if: runner.os != 'Windows'
        
      - name: Display build output (debug Windows)
        run: |
          Get-ChildItem -Path packages\cli\dist\
        shell: pwsh
        if: runner.os == 'Windows'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: packages/cli/dist/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./releases

      - name: Generate checksums
        run: |
          cd releases
          # Generate individual checksum files
          for file in */*; do
            sha256sum "$file" > "${file}.sha256"
          done
          
          # Combine all checksums into a single file
          {
            echo "# SHA256 Checksums"
            echo ""
          } > checksums.txt
          
          for checksum_file in */*.sha256; do
            checksum_line=$(head -n 1 "$checksum_file")
            checksum=$(echo "$checksum_line" | awk '{print $1}')
            filename=$(basename "$(dirname "$checksum_file")")/$(basename "${checksum_file%.sha256}")
            echo "\`${filename}\`: \`${checksum}\`" >> checksums.txt
          done

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          cp releases/*/* release_assets/
          cp releases/checksums.txt release_assets/

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          body: |
            ## Installation
            
            Download the appropriate executable for your platform:
            
            - **Linux**: [burger-api-linux](https://github.com/isfhan/burger-api/releases/download/${{ env.VERSION }}/burger-api-linux)
            - **Windows**: [burger-api.exe](https://github.com/isfhan/burger-api/releases/download/${{ env.VERSION }}/burger-api.exe)
            - **macOS (ARM64)**: [burger-api-mac](https://github.com/isfhan/burger-api/releases/download/${{ env.VERSION }}/burger-api-mac)
            - **macOS (Intel)**: [burger-api-mac-intel](https://github.com/isfhan/burger-api/releases/download/${{ env.VERSION }}/burger-api-mac-intel)
            
            ## Verification
            
            Check the [checksums.txt](https://github.com/isfhan/burger-api/releases/download/${{ env.VERSION }}/checksums.txt) file to verify the integrity of downloaded executables.
            
            ## Changelog
            
            See [CHANGELOG.md](https://github.com/isfhan/burger-api/blob/main/packages/cli/CHANGELOG.md) for details on what's new in this version.
          files: |
            release_assets/burger-api-linux
            release_assets/burger-api.exe
            release_assets/burger-api-mac
            release_assets/burger-api-mac-intel
            release_assets/checksums.txt
          draft: false
          prerelease: false